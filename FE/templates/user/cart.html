<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Bookstore</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="{{ url_for('static', filename='user/cart.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Short+Stack&family=Unica+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Ultra&display=swap" rel="stylesheet">
</head>
<body>
    {% include 'user/header.html' %}
    
    <!-- Blockchain Integration V3 -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script src="{{ url_for('static', filename='js/wallet.js') }}"></script>
    <script src="{{ url_for('static', filename='js/profile-guard.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/abis.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/cart-blockchain-v3.js') }}"></script>

    <div class="cart-container">
        <div class="cart-header">
            <input type="checkbox" id="select-all">
            <label for="select-all">Select all</label>
        </div>

        <div class="cart-items">
            <!-- Cart items will be loaded dynamically from blockchain -->
            <div id="cart-loading" style="text-align: center; padding: 60px 20px; color: #666;">
                <i class='bx bx-loader-alt bx-spin' style="font-size: 64px;"></i>
                <p style="margin-top: 20px; font-size: 18px;">Loading cart from blockchain...</p>
                <p style="margin-top: 8px; font-size: 14px; color: #888;">
                    Please wait while we connect to your wallet
                </p>
            </div>
        </div>

        <div class="cart-footer">
            <div class="balance">
                <p class="value">
                    <input type="checkbox">
                    <img src="{{ url_for('get_model_image', filename='xu.png') }}" alt="logo">
                    <span style="margin-right: 5px;">30,00</span>
                </p>
            </div>
            <div class="total">
                <span>Total: 0.0000 ETH</span>
            </div>
            <button class="order-btn" onclick="checkoutCart()">Checkout</button>
        </div>
    </div>

    {% include 'user/footer.html' %}

    <!-- All cart functionality is now handled by cart-blockchain-v3.js module -->
</body>
</html>
